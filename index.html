<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WERAE</title>

  <meta
    name="description"
    content="WERAE — Discover pre-owned fashion you'll love."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->
  


  <!-- WELCOME BANNER -->
  <section class="welcome" style="height:90px; min-height:90px; max-height:90px; overflow:hidden;">
    <div>
      <p>WELCOME TO WERAE</p>

      <h1>
        Discover fashion<br>
        you'll love.
      </h1>

      <button>Explore now →</button>
    </div>

  </section>


  <!-- CATEGORIES -->
  <section class="section">

    <div class="categories">

      <button>Women</button>
      <button>Men</button>
      <button>Bags</button>
      <button>Shoes</button>
      <button>Dresses</button>
      <button>Accessories</button>

    </div>

  </section>


  <!-- PRODUCTS -->
  <section class="section">

    <div class="products">

      <article class="product-card">
        <div class="product-image">Product photo</div>
        <h3>Premium Handbag</h3>
        <p>₦85,000</p>
        <small>✓ WERAE verified</small>
      </article>

      <article class="product-card">
        <div class="product-image">Product photo</div>
        <h3>Classic Sneakers</h3>
        <p>₦65,000</p>
        <small>✓ WERAE verified</small>
      </article>

      <article class="product-card">
        <div class="product-image">Product photo</div>
        <h3>Designer Jacket</h3>
        <p>₦120,000</p>
        <small>✓ WERAE verified</small>
      </article>

      <article class="product-card">
        <div class="product-image">Product photo</div>
        <h3>Leather Shoes</h3>
        <p>₦55,000</p>
        <small>✓ WERAE verified</small>
      </article>

    </div>

  </section>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button>Home</button>
    <button>Explore</button>
    <button>Orders</button>
    <button>Saved</button>
    <button>Profile</button>

  </nav>


  <script src="app.js"></script>

</body>
</html>
