<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In or Create Account — BODEGS</title>

  <meta
    name="description"
    content="Sign in or create your BODEGS customer account."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="auth-page">

    
<a href="index.html" class="back-button" aria-label="Return to home">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M15 5L8 12L15 19"></path>
  </svg>
</a>


        <header class="auth-header">
      <p class="verified-badge">BODEGS ACCOUNT</p>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSubtitle">Please enter your details to login.</p>
        </header>

        <section class="auth-card">

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="signInTab"
                role="tab" aria-selected="true">Login</button>
        <button type="button" class="auth-tab" id="createAccountTab"
                role="tab" aria-selected="false">Register</button>
      </div>

      <!-- LOGIN -->
      <form id="signInForm" novalidate>

        <div class="field">
          <label for="signInEmail">Email</label>
          <input type="email" id="signInEmail" name="email"
                 placeholder="hello@example.com"
                 autocomplete="email" inputmode="email" required>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="signInPassword">Password</label>
            <button type="button" class="text-link" id="forgotPassword">
              Forgot password?
            </button>
          </div>
          <div class="password-wrap">
            <input type="password" id="signInPassword" name="password"
                   placeholder="••••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="toggle-password"
                    aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <label class="check" for="rememberMe">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>

        <p class="auth-message" id="signInMessage" role="alert" aria-live="polite"></p>

        <button type="submit" class="auth-submit">Login</button>

        <div class="auth-divider"><span>OR</span></div>

        <button type="button" class="social-btn" data-provider="Apple" aria-label="Continue with Apple">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"></path>
          </svg>
          <span>Continue with Apple</span>
        </button>

        <button type="button" class="social-btn" data-provider="Google" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
          </svg>
          <span>Continue with Google</span>
        </button>

        <p class="auth-switch">
          Don’t have an account?
          <button type="button" class="text-link" data-switch="register">Register</button>
        </p>

      </form>

      <!-- REGISTER -->
      <form id="createAccountForm" novalidate hidden>

        <div class="field">
          <label for="createName">Full name</label>
          <input type="text" id="createName" name="name"
                 placeholder="Your full name"
                 autocomplete="name" required>
        </div>

        <div class="field">
          <label for="createEmail">Email</label>
          <input type="email" id="createEmail" name="email"
                 placeholder="hello@example.com"
                 autocomplete="email" inputmode="email" required>
        </div>

        <div class="field">
          <label for="createPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="createPassword" name="new-password"
                   placeholder="Create a password"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-password"
                    aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" name="confirm-password"
                   placeholder="Repeat your password"
                   autocomplete="new-password" required>
            <button type="button" class="toggle-password"
                    aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <label class="check" for="acceptTerms">
          <input type="checkbox" id="acceptTerms">
          <span>I accept the <strong>Terms and Conditions</strong></span>
        </label>

        <p class="auth-message" id="createAccountMessage" role="alert" aria-live="polite"></p>

        <button type="submit" class="auth-submit">Create an account</button>

        <p class="auth-switch">
          Have an account?
          <button type="button" class="text-link" data-switch="login">Log in</button>
        </p>

      </form>

        </section>
  </main>

    <script>

    const signInTab = document.getElementById("signInTab");
    const createAccountTab = document.getElementById("createAccountTab");
    const signInForm = document.getElementById("signInForm");
    const createAccountForm = document.getElementById("createAccountForm");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const signInMessage = document.getElementById("signInMessage");
    const createAccountMessage = document.getElementById("createAccountMessage");

    const signInEmail = document.getElementById("signInEmail");
    const signInPassword = document.getElementById("signInPassword");
    const createEmail = document.getElementById("createEmail");
    const createPassword = document.getElementById("createPassword");
    const rememberMe = document.getElementById("rememberMe");

    /* Switch between flows (keeps what the user typed) */

    function setMode(mode) {

      const isLogin = mode === "login";

      signInTab.classList.toggle("active", isLogin);
      createAccountTab.classList.toggle("active", !isLogin);
      signInTab.setAttribute("aria-selected", String(isLogin));
      createAccountTab.setAttribute("aria-selected", String(!isLogin));

      signInForm.hidden = !isLogin;
      createAccountForm.hidden = isLogin;

      authTitle.textContent =
        isLogin ? "Welcome back" : "Create an account";

      authSubtitle.textContent =
        isLogin
          ? "Please enter your details to login."
          : "Please enter your details to register.";

      signInMessage.textContent = "";
      createAccountMessage.textContent = "";
    }

    signInTab.addEventListener("click", () => setMode("login"));
    createAccountTab.addEventListener("click", () => setMode("register"));

    document.querySelectorAll("[data-switch]").forEach(button => {
      button.addEventListener("click", () => {
        setMode(button.dataset.switch === "register" ? "register" : "login");
      });
    });

    /* Mirror email and password between the two forms */

    function mirror(from, to) {
      from.addEventListener("input", () => { to.value = from.value; });
    }

    mirror(signInEmail, createEmail);
    mirror(createEmail, signInEmail);
    mirror(signInPassword, createPassword);
    mirror(createPassword, signInPassword);

    /* Show / hide password */

    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {

        const input = button.parentElement.querySelector("input");
        const showing = input.type === "text";

        input.type = showing ? "password" : "text";

        button.classList.toggle("is-visible", !showing);
        button.setAttribute("aria-pressed", String(!showing));
        button.setAttribute(
          "aria-label",
          showing ? "Show password" : "Hide password"
        );
      });
    });

    /* Forgot password / social login placeholders */

    document.getElementById("forgotPassword").addEventListener("click", () => {
      // TODO: replace with a real reset page
      signInMessage.className = "auth-message info";
      signInMessage.textContent =
        "Password reset isn’t available yet. Please contact BODEGS support.";
    });

    document.querySelectorAll(".social-btn").forEach(button => {
      button.addEventListener("click", () => {
        // TODO: connect to real Apple / Google sign-in
        signInMessage.className = "auth-message info";
        signInMessage.textContent =
          button.dataset.provider + " login is coming soon.";
      });
    });

    /* Remember me (email only) */

    const rememberedEmail = localStorage.getItem("weraeRememberedEmail");

    if (rememberedEmail) {
      signInEmail.value = rememberedEmail;
      createEmail.value = rememberedEmail;
      rememberMe.checked = true;
    }

    /* Where to go after login */

    const urlParams = new URLSearchParams(window.location.search);
    const returnPage = urlParams.get("return") || "profile";

    function goAfterAuth() {
      window.location.href =
        returnPage === "checkout" ? "checkout.html" : "profile.html";
    }

    function showError(element, text) {
      element.className = "auth-message";
      element.textContent = text;
    }

    /* Login */

    signInForm.addEventListener("submit", event => {

      event.preventDefault();

      const email = signInEmail.value.trim();
      const password = signInPassword.value;

      if (!email || !password) {
        showError(signInMessage, "Please enter your email and password.");
        return;
      }

      const savedUser = JSON.parse(
        localStorage.getItem("weraeUser") || "null"
      );

      if (!savedUser) {
        showError(
          signInMessage,
          "No BODEGS account was found. Please create an account first."
        );
        return;
      }

      if (savedUser.email !== email || savedUser.password !== password) {
        showError(signInMessage, "The email or password is incorrect.");
        return;
      }

      if (rememberMe.checked) {
        localStorage.setItem("weraeRememberedEmail", email);
      } else {
        localStorage.removeItem("weraeRememberedEmail");
      }

      savedUser.loggedIn = true;
      localStorage.setItem("weraeUser", JSON.stringify(savedUser));

      goAfterAuth();
    });

    /* Register */

    createAccountForm.addEventListener("submit", event => {

      event.preventDefault();

      const name = document.getElementById("createName").value.trim();
      const email = createEmail.value.trim();
      const password = createPassword.value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!name || !email || !password) {
        showError(createAccountMessage, "Please fill in all fields.");
        return;
      }

      if (password !== confirmPassword) {
        showError(createAccountMessage, "Passwords do not match.");
        return;
      }

      if (!document.getElementById("acceptTerms").checked) {
        showError(
          createAccountMessage,
          "Please accept the Terms and Conditions to continue."
        );
        return;
      }

      const user = {
        name: name,
        email: email,
        password: password,
        loggedIn: true
      };

      localStorage.setItem("weraeUser", JSON.stringify(user));

      goAfterAuth();
    });

        </script>
</body>
</html>
