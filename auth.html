<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in — BODEGS</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #f5f5f7; color: #555; }
  </style>
</head>
<body>
  <p>Please wait...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    // auth.html is now only a doorway. The real sign-in is login.html (Supabase).
    (async () => {
      // Old pages send people here after "Sign Out" (they set loggedIn to false).
      // When that happens, also end the real Supabase session.
      try {
        const u = JSON.parse(localStorage.getItem("weraeUser") || "null");
        if (u && u.loggedIn === false) {
          await sb.auth.signOut();
          localStorage.removeItem("weraeUser");
        }
      } catch (e) {}

      // Keep the old "?return=checkout" behaviour.
      const ret = new URLSearchParams(location.search).get("return");
      const next = ret === "checkout" ? "checkout.html" : "profile.html";
      location.replace("login.html?next=" + encodeURIComponent(next));
    })();
  </script>
</body>
</html>
