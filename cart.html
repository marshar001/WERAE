<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart — WERAE</title>

  <meta
    name="description"
    content="Review your WERAE shopping cart."
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="cart-page">

    <a href="index.html" class="back-button">
      ← Continue Shopping
    </a>

    <header class="cart-header">
      <p class="verified-badge">WERAE SHOPPING CART</p>
      <h1>Your Cart</h1>
      <p>Review your selected items before checkout.</p>
    </header>

    <section class="cart-items" id="cartItems">
    </section>

<section class="recently-viewed">

  <div class="recently-viewed-header">
    <h2>Recently Viewed</h2>
    <a href="explore.html">View all</a>
  </div>

  <div class="recently-viewed-grid" id="recentlyViewedGrid"></div>
</section>
  </main>


  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 0 1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-9Z"></path>
        <path d="M9 21v-6h6v6"></path>
      </svg>
      <span>Home</span>
    </a>

    <a href="explore.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
      <span>Explore</span>
    </a>

    <a href="cart.html" class="nav-item active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 8h14l-1 12H6L5 8Z"></path>
        <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
      </svg>
      <span>Cart</span>
    </a>

    <a href="orders.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
        <path d="M8 8h8M8 12h8M8 16h5"></path>
      </svg>
      <span>Orders</span>
    </a>

    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20a7 7 0 0 1 14 0"></path>
      </svg>
      <span>Profile</span>
    </a>

    </nav>

  <script>
    const recentlyViewedGrid =
      document.getElementById("recentlyViewedGrid");

    const recentlyViewedProducts = JSON.parse(
      localStorage.getItem("weraeRecentlyViewed") || "[]"
    );

    recentlyViewedProducts.forEach(product => {
      const card = document.createElement("a");

      card.href = product.url;
      card.className = "recently-viewed-card";

      card.innerHTML = `
        <div class="recently-viewed-image">
          <img src="${product.image}" alt="${product.name}">
        </div>
        <h3>${product.name}</h3>
        <p>${product.price}</p>
      `;

      recentlyViewedGrid.appendChild(card);
    });
        const cartItems = document.getElementById("cartItems");

    const cartProducts = JSON.parse(
      localStorage.getItem("weraeCart") || "[]"
    );

        if (cartProducts.length === 0) {

      cartItems.innerHTML = `
        <div class="cart-empty">
          <h2>Your cart is empty</h2>
          <p>Add products to your cart and they will appear here.</p>

          <a href="index.html" class="continue-shopping">
            Start Shopping
          </a>
        </div>
      `;

    } else {

      cartProducts.forEach((product, index) => {

        const item = document.createElement("article");

        item.className = "cart-product";

        item.innerHTML = `
          <div class="cart-product-select">
            <input
              type="checkbox"
              checked
              aria-label="Select ${product.name}"
            >
          </div>

          <div class="cart-product-image">
            <img
              src="${product.image}"
              alt="${product.name}"
            >
          </div>

          <div class="cart-product-details">

            <h2>
              ${product.name}
            </h2>

            <p class="cart-product-price">
              ${product.price}
            </p>

            <div class="cart-product-controls">

              <button
                type="button"
                class="cart-quantity"
                aria-label="Quantity"
              >
                1
              </button>

              <button
                type="button"
                class="cart-remove"
                data-index="${index}"
                aria-label="Remove ${product.name}"
              >
                Remove
              </button>

            </div>

          </div>
        `;

        cartItems.appendChild(item);

      });

    }
  </script>

</body>
</html>
