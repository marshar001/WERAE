<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BODEGS</title>
  <style>
    :root { --brand: #173b32; --bg: #f5f0e7; --card: #faf7f1; --muted: #6f7f78; --line: rgba(23,59,50,.22); --red: #b3261e; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: var(--bg); color: var(--brand); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 28px 18px 36px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 26px; }
    .brand i { width: 46px; height: 46px; border-radius: 15px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 23px; font-style: normal; box-shadow: 0 8px 18px rgba(0,0,0,.18); }
    .brand b { display: block; font-family: Georgia, serif; font-size: 22px; letter-spacing: .1em; line-height: 1; }
    .brand small { display: block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .24em; color: var(--muted); }
    h1 { margin: 0 0 8px; text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 34px; line-height: 1.12; }
    .sub { margin: 0 auto 24px; max-width: 320px; text-align: center; color: var(--muted); font-size: 15.5px; line-height: 1.45; }
    .card { background: var(--card); border-radius: 26px; padding: 22px 20px; box-shadow: 0 14px 40px rgba(0,0,0,.09); }
    .msg { margin: 0 0 14px; padding: 11px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; background: var(--bg); }
    .msg.err { background: #fdecea; color: var(--red); }
    .msg.ok { background: #e6f4ea; color: #1f6f43; }
    .lab { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font-size: 15px; font-weight: 700; }
    .lab button, .lab a { border: 0; background: none; padding: 0; color: var(--brand); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .field { position: relative; margin-bottom: 18px; }
    .field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; fill: none; stroke: var(--brand); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .field input { display: block; width: 100%; height: 54px; padding: 0 14px 0 46px; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; font-family: inherit; font-size: 16px; color: var(--brand); outline: none; }
    .field input::placeholder { color: var(--muted); opacity: .75; }
    .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,0,0,.05); }
    .field input[readonly] { opacity: .7; }
    .field .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
    .field .eye svg { position: static; transform: none; width: 22px; height: 22px; pointer-events: none; }
    .field.hasEye input { padding-right: 52px; }
    .remember { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; font-size: 15px; cursor: pointer; }
    .remember input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border: 1.7px solid var(--brand); border-radius: 7px; background: transparent; display: grid; place-content: center; cursor: pointer; }
    .remember input:checked { background: var(--brand); }
    .remember input:checked::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
    .go { width: 100%; height: 56px; border: 0; border-radius: 18px; background: var(--brand); color: #fff; font-family: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 22px rgba(0,0,0,.20); text-decoration: none; }
    .go svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .go:disabled { opacity: .6; }
    .or { display: flex; align-items: center; gap: 14px; margin: 18px 0; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: .06em; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .alt { width: 100%; height: 54px; border: 1.5px solid var(--line); border-radius: 18px; background: transparent; color: var(--brand); font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; text-decoration: none; }
    .alt svg { width: 22px; height: 22px; }
    .switch { margin: 20px 0 0; text-align: center; font-size: 15px; color: var(--muted); }
    .switch button, .switch a { border: 0; background: none; padding: 0 0 0 6px; color: var(--brand); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .fine { margin: 26px 8px 0; text-align: center; font-size: 13px; line-height: 1.7; color: var(--muted); }
    .fine a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><i>B</i><div><b>BODEGS</b></div></div>
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="sub">Please enter your details to login.</p>
  <div class="card">
    <div class="msg err" id="err" hidden></div>
    <div class="msg ok" id="ok" hidden></div>
    <form id="form" novalidate>
      <div id="nameWrap" hidden>
        <div class="lab">Full name</div>
        <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20.5c.8-4 3.7-6 7.5-6s6.7 2 7.5 6"></path></svg><input id="name" type="text" autocomplete="name" placeholder="Your full name"></div>
      </div>
      <div class="lab">Email</div>
      <div class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m4 7 8 6 8-6"></path></svg><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="hello@example.com"></div>
      <div class="lab"><span>Password <span id="pwHint" hidden style="font-weight:400;color:var(--muted)">(8+ characters)</span></span><button type="button" id="forgot">Forgot password?</button></div>
      <div class="field hasEye"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"></rect><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path></svg><input id="password" type="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="eye" id="showPw" aria-label="Show password"><svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
      <label class="remember" id="rememberWrap"><input type="checkbox" id="remember"> Remember me</label>
      <button class="go" id="go" type="submit"><span id="goText">Login</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"></path></svg></button>
    </form>
    <div class="or">OR</div>
    <button class="alt" type="button" id="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.5-4.7 7.2l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.6z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <p class="switch"><span id="switchText">Don&rsquo;t have an account?</span><button type="button" id="switchBtn">Register</button></p>
    <p class="switch" style="margin-top:10px">Selling on BODEGS?<a href="seller-login.html">Log in to your seller account</a></p>
  </div>
  <p class="fine">By continuing, you agree to BODEGS&rsquo;s Terms of Service and acknowledge that you&rsquo;ve read our Privacy Policy.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const rawNext = params.get("next") || "";
  // only allow plain page names on this site (no http:, no //)
  const next = /^[A-Za-z0-9_\-]+\.html(\?[^#]*)?(#.*)?$/.test(rawNext) ? rawNext : "index.html";
  const forSeller = /^seller/.test(rawNext);
  let signup = params.get("mode") === "signup";

  function say(kind, text) {
    $("err").hidden = $("ok").hidden = true;
    if (!text) return;
    const box = $(kind); box.textContent = text; box.hidden = false;
  }
  function friendly(e) {
    const m = (e && e.message || "").toLowerCase();
    if (m.indexOf("invalid login") >= 0) return "Wrong email or password. Please try again.";
    if (m.indexOf("already registered") >= 0 || m.indexOf("already been registered") >= 0) return "That email already has an account. Tap Login instead.";
    if (m.indexOf("password") >= 0 && m.indexOf("6") >= 0) return "Choose a longer password (at least 8 characters).";
    if (m.indexOf("rate") >= 0) return "Too many tries. Please wait a minute and try again.";
    if (m.indexOf("confirm") >= 0) return "Please confirm your email first, then log in.";
    if (m.indexOf("provider") >= 0 && m.indexOf("enabled") >= 0) return "Google login is not switched on yet. Please use your email and password.";
    if (m.indexOf("fetch") >= 0 || m.indexOf("network") >= 0) return "No connection. Check your internet and try again.";
    return (e && e.message) || "Something went wrong. Please try again.";
  }

  function layout() {
    $("nameWrap").hidden = !signup;
    $("pwHint").hidden = !signup;
    $("forgot").hidden = signup;
    $("rememberWrap").hidden = signup;
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("goText").textContent = signup ? "Create account" : "Login";
    $("title").textContent = signup ? "Create your account" : "Welcome back";
    $("sub").textContent = signup ? "Join to shop pre-owned fashion from trusted sellers." : (forSeller ? "Login with your BODEGS account first. Next you will log in to your seller account." : "Please enter your details to login.");
    $("switchText").textContent = signup ? "Already have an account?" : "Don’t have an account?";
    $("switchBtn").textContent = signup ? "Login" : "Register";
    say("err", "");
  }
  $("switchBtn").addEventListener("click", () => { signup = !signup; layout(); });

  $("forgot").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) { say("err", "Type your email above first, then tap Forgot password."); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL("login.html", location.href).href });
    if (error) say("err", friendly(error)); else say("ok", "Password reset link sent. Check your email.");
  });

  $("showPw").addEventListener("click", () => {
    const p = $("password");
    p.type = p.type === "password" ? "text" : "password";
  });

  // remember me = remember the email on this phone
  try {
    const saved = localStorage.getItem("bodegsEmail");
    if (saved) { $("email").value = saved; $("remember").checked = true; }
  } catch (e) {}

  $("google").addEventListener("click", async () => {
    say("err", "");
    try {
      const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: new URL(next, location.href).href } });
      if (error) throw error;
    } catch (err) { say("err", friendly(err)); }
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    say("err", "");
    const email = $("email").value.trim();
    const password = $("password").value;
    const name = $("name").value.trim();
    if (!email || email.indexOf("@") < 1) { say("err", "Enter a valid email address."); return; }
    if (!password) { say("err", "Enter your password."); return; }
    if (signup) {
      if (!name) { say("err", "Enter your full name."); return; }
      if (password.length < 8) { say("err", "Your password needs at least 8 characters."); return; }
    }
    $("go").disabled = true;
    try {
      if (signup) {
        const { data, error } = await signUp(email, password, name);
        if (error) throw error;
        if (!data.session) {
          say("ok", "Account created. Check your email to confirm it, then login.");
          signup = false; layout();
          say("ok", "Account created. Check your email to confirm it, then login.");
          $("go").disabled = false;
          return;
        }
      } else {
        const { error } = await signIn(email, password);
        if (error) throw error;
        try { if ($("remember").checked) localStorage.setItem("bodegsEmail", email); else localStorage.removeItem("bodegsEmail"); } catch (x) {}
      }
      location.replace(next);
    } catch (err) {
      say("err", friendly(err));
      $("go").disabled = false;
    }
  });

  layout();
  // already signed in: go straight on
  currentUser().then((u) => { if (u && !params.get("stay")) location.replace(next); }).catch(() => {});
})();
</script>
</body>
</html>
