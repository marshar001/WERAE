
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders — BODEGS</title>
  <meta
    name="description"
    content="View and track your BODEGS fashion orders."
  >

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css?v=20261031">
  <script src="theme.js?v=20261031" defer></script>

  <style>
    .orders-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 110px;
      min-height: 100vh;
    }

    .orders-header {
      margin: 24px 0;
    }

    .orders-header .verified-badge {
      color: #111;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    .orders-header h1 {
      margin: 8px 0;
      color: var(--text);
      font-size: 30px;
    }

    .orders-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .orders-filters {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 4px 0 16px;
      margin-bottom: 8px;
    }

    .orders-filter {
      flex-shrink: 0;
      border: 1px solid var(--sage);
      border-radius: 22px;
      padding: 10px 17px;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .orders-filter.active {
      background: var(--deep-green);
      border-color: var(--deep-green);
      color: var(--white);
    }

    .order-card {
      background: var(--cream-light);
      border: 1px solid rgba(23, 59, 50, 0.10);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding-bottom: 13px;
      border-bottom: 1px solid rgba(23, 59, 50, 0.12);
    }

    .order-number {
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .order-date {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
    }

    .order-status {
      display: inline-block;
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 20px;
      background: var(--sage);
      color: #111;
      font-size: 11px;
      font-weight: bold;
    }

    .order-status.pending {
      background: #f5e5bd;
      color: #795516;
    }

    .order-status.cancelled {
      background: #f3d8d5;
      color: #873b32;
    }

    .order-products {
      padding: 14px 0;
    }

    .order-product {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .order-product:last-child {
      margin-bottom: 0;
    }

    .order-product img {
      width: 68px;
      height: 78px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 12px;
      background: var(--cream);
    }

    .order-product-info {
      flex: 1;
      min-width: 0;
    }

    .order-product-info h3 {
      color: var(--text);
      font-size: 14px;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
    }

    .order-product-info p {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }

    .order-product-price {
      color: #111;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .order-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 13px;
      border-top: 1px solid rgba(23, 59, 50, 0.12);
    }

    .order-total-label {
      color: var(--muted);
      font-size: 12px;
    }

    .order-total {
      display: block;
      margin-top: 5px;
      color: #111;
      font-size: 17px;
    }

    .order-action {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--deep-green);
      color: var(--white);
      text-decoration: none;
      font-size: 12px;
      text-align: center;
    }

    .orders-empty {
      padding: 35px 20px;
      margin-top: 12px;
      border-radius: 22px;
      background: var(--cream-light);
      text-align: center;
    }

    .orders-empty-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--sage);
      display: grid;
      place-items: center;
    }

    .orders-empty-icon svg {
      width: 27px;
      height: 27px;
      fill: none;
      stroke: var(--deep-green);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orders-empty h2 {
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .orders-empty p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .orders-empty a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--deep-green);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
    }

    .orders-message {
      padding: 20px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .orders-page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .order-card {
        padding: 12px;
      }

      .order-product img {
        width: 58px;
        height: 68px;
      }

      .order-product-price {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="orders-page">

    <a
      href="profile.html"
      class="back-button"
      aria-label="Back to profile"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5L8 12L15 19"></path>
      </svg>
    </a>

    <header class="orders-header">
      <p class="verified-badge">BODEGS ACCOUNT</p>
      <h1>My Orders</h1>
      <p>View your purchases and keep track of your orders.</p>
    </header>

    <nav class="orders-filters" aria-label="Filter orders">
      <button
        type="button"
        class="orders-filter active"
        data-filter="all"
        aria-pressed="true"
      >
        All Orders
      </button>

      <button
        type="button"
        class="orders-filter"
        data-filter="pending"
        aria-pressed="false"
      >
        Pending
      </button>

      <button
        type="button"
        class="orders-filter"
        data-filter="processing"
        aria-pressed="false"
      >
        Processing
      </button>

      <button
        type="button"
        class="orders-filter"
        data-filter="shipped"
        aria-pressed="false"
      >
        Shipped
      </button>

      <button
        type="button"
        class="orders-filter"
        data-filter="delivered"
        aria-pressed="false"
      >
        Delivered
      </button>
    </nav>

    <section id="ordersList" aria-live="polite"></section>

  </main>

  <!-- BOTTOM NAVIGATION -->

  <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-9Z"></path>
        <path d="M9 21v-6h6v6"></path>
      </svg>
      <span>Home</span>
    </a>

    <a href="explore.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="m16 16 5 5"></path>
      </svg>
      <span>Explore</span>
    </a>

    <a href="cart.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 8h14l-1 12H6L5 8Z"></path>
        <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
      </svg>
      <span>Cart</span>
    </a>

    <a href="orders.html" class="nav-item active" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
        <path d="M8 8h8M8 12h8M8 16h5"></path>
      </svg>
      <span>Orders</span>
    </a>

    <a href="profile.html" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20a7 7 0 0 1 14 0"></path>
      </svg>
      <span>Profile</span>
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
    const ordersList = document.getElementById("ordersList");
    const filterButtons = document.querySelectorAll(".orders-filter");

    let currentFilter = "all";

    // Orders are loaded from the BODEGS database (see the bottom of this script).
    let loadedOrders = [];

    function readOrders() {
      return loadedOrders;
    }

    function formatMoney(value) {
      const amount = Number(
        String(value ?? 0).replace(/[^\d.-]/g, "")
      );

      return "₦" + (
        Number.isFinite(amount) ? amount : 0
      ).toLocaleString("en-NG");
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function normaliseStatus(status) {
      const value = String(status || "pending")
        .toLowerCase()
        .trim();

      if (value === "confirmed" || value === "processing") {
        return "processing";
      }

      if (value === "shipped" || value === "in transit") {
        return "shipped";
      }

      if (value === "delivered" || value === "completed") {
        return "delivered";
      }

      if (value === "cancelled" || value === "canceled") {
        return "cancelled";
      }

      return "pending";
    }

    function formatDate(value) {
      if (!value) return "Date unavailable";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return escapeHTML(value);
      }

      return date.toLocaleDateString("en-NG", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function calculateOrderTotal(order) {
      if (order.total !== undefined) {
        return Number(
          String(order.total).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      if (order.totalAmount !== undefined) {
        return Number(
          String(order.totalAmount).replace(/[^\d.-]/g, "")
        ) || 0;
      }

      const products = Array.isArray(order.products)
        ? order.products
        : Array.isArray(order.items)
          ? order.items
          : [];

      return products.reduce((sum, product) => {
        const price = Number(
          String(product.price ?? 0).replace(/[^\d.-]/g, "")
        ) || 0;

        const quantity = Number(product.quantity) || 1;

        return sum + price * quantity;
      }, 0);
    }

    function renderEmptyState() {
      ordersList.innerHTML = `
        <div class="orders-empty">
          <div class="orders-empty-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v14A1.5 1.5 0 0 1 18 20.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"></path>
              <path d="M8 8h8M8 12h8M8 16h5"></path>
            </svg>
          </div>

          <h2>No orders yet</h2>

          <p>
            Your purchases will appear here once you place
            an order. Discover something you love.
          </p>

          <a href="explore.html">Start Shopping</a>
        </div>
      `;
    }

    function renderOrders() {
      const allOrders = readOrders();

      const filteredOrders = currentFilter === "all"
        ? allOrders
        : allOrders.filter(order =>
            normaliseStatus(order.status) === currentFilter
          );

      if (allOrders.length === 0) {
        renderEmptyState();
        return;
      }

      if (filteredOrders.length === 0) {
        ordersList.innerHTML = `
          <div class="orders-message">
            No ${escapeHTML(currentFilter)} orders to show.
          </div>
        `;
        return;
      }

      ordersList.innerHTML = filteredOrders.map((order, index) => {
        const products = Array.isArray(order.products)
          ? order.products
          : Array.isArray(order.items)
            ? order.items
            : [];

        const status = normaliseStatus(order.status);

        const orderId = order.id ||
          order.orderId ||
          `ORDER-${String(index + 1).padStart(4, "0")}`;

        const date = order.date ||
          order.createdAt ||
          order.created_at;

        const total = calculateOrderTotal(order);

        const productMarkup = products.length
          ? products.map(product => {
              const name = escapeHTML(product.name || "Fashion item");
              const image = escapeHTML(product.image || " ");
              const quantity = Number(product.quantity) || 1;
              const price = Number(
                String(product.price ?? 0).replace(/[^\d.-]/g, "")
              ) || 0;

              return `
                <div class="order-product">
                  <img
                    src="${image}"
                    alt="${name}"
                    loading="lazy"
                    onerror="this.style.visibility='hidden'"
                  >

                  <div class="order-product-info">
                    <h3>${name}</h3>
                    <p>Quantity: ${quantity}</p>
                  </div>

                  <span class="order-product-price">
                    ${formatMoney(price * quantity)}
                  </span>
                </div>
              `;
            }).join("")
          : `<p class="order-date">Order items unavailable</p>`;

        return `
          <article class="order-card">
            <div class="order-card-header">
              <div>
                <div class="order-number">
                  Order #${escapeHTML(orderId)}
                </div>

                <div class="order-date">
                  ${formatDate(date)}
                </div>
              </div>

              <span class="order-status ${status}">
                ${status.charAt(0).toUpperCase() + status.slice(1)}
              </span>
            </div>

            <div class="order-products">
              ${productMarkup}
            </div>

            <div class="order-card-footer">
              <div>
                <span class="order-total-label">Order total</span>
                <strong class="order-total">
                  ${formatMoney(total)}
                </strong>
              </div>

              <a
                class="order-action"
                href="profile.html"
                aria-label="View account for order ${escapeHTML(orderId)}"
              >
                Order details
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
          const active = item === button;

          item.classList.toggle("active", active);
          item.setAttribute("aria-pressed", String(active));
        });

        renderOrders();
      });
    });

    (async function loadMyOrders() {
      ordersList.innerHTML =
        '<div class="orders-message">Loading your orders...</div>';

      const user = await requireLogin();
      if (!user) return;

      const { data, error } = await sb
        .from("orders")
        .select(
          "id, status, total, created_at, " +
          "order_items(qty, price_at_purchase, product_name, product_image)"
        )
        .eq("user_id", user.id)
        .order("created_at", { ascending: false });

      if (error) {
        ordersList.innerHTML =
          '<div class="orders-message">We could not load your orders. ' +
          'Please check your connection and try again.</div>';
        return;
      }

      loadedOrders = data.map(order => ({
        id: "BOD-" + String(order.id).slice(0, 8).toUpperCase(),
        createdAt: order.created_at,
        status: order.status,
        total: order.total,
        products: (order.order_items || []).map(item => ({
          name: item.product_name,
          image: item.product_image,
          price: item.price_at_purchase,
          quantity: item.qty
        }))
      }));

      renderOrders();
    })();
  </script>

</body>
  </html>
