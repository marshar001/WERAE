<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore — WERAE</title>

  <meta
    name="description"
    content="Explore men's, women's and kids fashion on WERAE."
  >

  <link rel="stylesheet" href="styles.css">

  <style>

    /* =====================================================
       EXPLORE PAGE
    ===================================================== */

    .explore-page {
      padding-bottom: 95px;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .explore-header {
      padding: 18px 14px 5px;
    }

    .explore-header h1 {
      margin: 0 0 4px;

      font-size: 23px;
      line-height: 1.1;

      color: var(--green, #173b32);
    }

    .explore-header p {
      margin: 0;

      font-size: 12px;
      line-height: 1.4;

      color: var(--muted, #777);
    }


    /* =====================================================
       SEARCH BAR
    ===================================================== */

    .explore-search {
      padding: 7px 12px 15px;
    }

    .explore-search-box {
      display: flex;
      align-items: center;
      gap: 8px;

      width: 100%;
      box-sizing: border-box;

      background: #ffffff;

      border: 1px solid rgba(23, 59, 50, 0.07);

      border-radius: 17px;

      padding: 12px 14px;

      box-shadow:
        0 4px 12px rgba(23, 59, 50, 0.06);
    }

    .explore-search-icon {
      flex: 0 0 auto;

      font-size: 18px;
      line-height: 1;

      color: #555;
    }

    .explore-search-box input {
      width: 100%;

      border: none;
      outline: none;

      background: transparent;

      font-family: Arial, sans-serif;

      font-size: 13px;

      color: var(--green, #173b32);
    }

    .explore-search-box input::placeholder {
      color: #999;
    }


    /* =====================================================
       TOP CATEGORY NAVIGATION
    ===================================================== */

    .explore-tabs {
      display: flex;

      gap: 27px;

      padding: 0 15px 11px;

      overflow-x: auto;

      scrollbar-width: none;

      border-bottom:
        1px solid rgba(23, 59, 50, 0.08);
    }

    .explore-tabs::-webkit-scrollbar {
      display: none;
    }

    .explore-tab {
      position: relative;

      flex: 0 0 auto;

      text-decoration: none;

      color: #777;

      font-size: 12px;

      font-weight: 700;

      padding-bottom: 6px;
    }

    .explore-tab.active {
      color: var(--green, #173b32);
    }

    .explore-tab.active::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 3px;

      border-radius: 3px;

      background:
        var(--green, #173b32);
    }


    /* =====================================================
       SECTION
    ===================================================== */

    .explore-section {
      padding: 0 10px;

      margin-top: 20px;

      margin-bottom: 25px;

      scroll-margin-top: 15px;
    }

    .explore-section-heading {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin: 0 5px 10px;
    }

    .explore-section-heading h2 {
      margin: 0;

      font-size: 18px;

      line-height: 1.2;

      color:
        var(--green, #173b32);
    }

    .explore-section-heading span {
      font-size: 10px;

      color:
        var(--muted, #777);
    }


    /* =====================================================
       CATEGORY GRID
       SAME GENERAL SHAPE AS THE CURRENT EXPLORE DESIGN
    ===================================================== */

    .explore-categories {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 10px 7px;
    }

    .explore-category {
      display: block;

      min-width: 0;

      text-decoration: none;

      color: inherit;
    }

    .explore-category-image {
      width: 100%;

      aspect-ratio: 1 / 1;

      overflow: hidden;

      border-radius: 16px;

      background: #e4dfd5;

      box-shadow:
        0 3px 8px
        rgba(23, 59, 50, 0.06);
    }

    .explore-category-image img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }

    .explore-category-name {
      display: block;

      min-height: 22px;

      margin-top: 5px;

      text-align: center;

      font-family: Georgia, serif;

      font-size: 9px;

      line-height: 1.15;

      font-weight: 700;

      color:
        var(--green, #173b32);
    }


    /* =====================================================
       ALL PRODUCTS
    ===================================================== */

    .products-section {
      margin-top: 24px;

      margin-bottom: 28px;
    }

    .explore-products {
      column-count: 2;

      column-gap: 5px;
    }

    .explore-product {
      break-inside: avoid;

      margin-bottom: 5px;

      overflow: hidden;

      background:
        var(--cream-light, #faf8f2);

      border:
        1px solid rgba(23, 59, 50, 0.06);

      border-radius: 17px;

      padding: 3px;

      box-shadow:
        0 5px 14px
        rgba(23, 59, 50, 0.06);
    }

    .explore-product a {
      display: block;

      text-decoration: none;

      color: inherit;
    }

    .explore-product-image {
      overflow: hidden;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          #e4dfd5,
          #d4dcd3
        );
    }

    .explore-product-image img {
      width: 100%;
      height: auto;

      display: block;

      object-fit: contain;
    }

    .explore-product-info {
      padding: 8px 7px 7px;
    }

    .explore-product-name {
      margin: 0 0 3px;

      font-size: 12px;

      line-height: 1.25;

      font-weight: 700;

      color:
        var(--green, #173b32);
    }

    .explore-product-price {
      margin: 0 0 4px;

      font-size: 12px;

      font-weight: 700;

      color:
        var(--green, #173b32);
    }

    .explore-product-description {
      margin: 0 0 5px;

      font-size: 9px;

      line-height: 1.35;

      color:
        var(--muted, #777);
    }

    .explore-verified {
      display: inline-flex;

      align-items: center;

      gap: 3px;

      font-size: 8px;

      color: #315d4f;

      font-weight: 700;
    }


    /* =====================================================
       TRENDING STYLES
       THIS IS INTENTIONALLY AFTER ALL PRODUCTS
    ===================================================== */

    .trending-styles-section {
      margin-top: 28px;

      margin-bottom: 30px;
    }

    .trending-styles-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 10px 7px;
    }


    /* =====================================================
       BOTTOM NAVIGATION
    ===================================================== */

    .bottom-nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 1000;

      display: flex;

      align-items: center;

      justify-content: space-around;

      height: 67px;

      padding:
        5px 5px
        env(safe-area-inset-bottom);

      background:
        rgba(250, 248, 242, 0.97);

      border-top:
        1px solid rgba(23, 59, 50, 0.08);

      box-shadow:
        0 -4px 15px
        rgba(23, 59, 50, 0.05);

      backdrop-filter: blur(10px);

      -webkit-backdrop-filter: blur(10px);
    }

    .bottom-nav .nav-item {
      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      min-height: 48px;

      border: none;

      background: transparent;

      text-decoration: none;

      font-family: Arial, sans-serif;

      font-size: 10px;

      font-weight: 600;

      color: #777;
    }

    .bottom-nav .nav-item.active {
      color:
        var(--green, #173b32);

      font-weight: 700;
    }


    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 700px) {

      .explore-page {
        max-width: 900px;

        margin: 0 auto;
      }

      .explore-categories,
      .trending-styles-grid {
        grid-template-columns:
          repeat(8, minmax(0, 1fr));
      }

      .explore-products {
        column-count: 3;
      }

      .bottom-nav {
        left: 50%;
        right: auto;

        width: 100%;

        max-width: 900px;

        transform:
          translateX(-50%);

        border-radius:
          18px 18px 0 0;
      }

    }

  </style>
</head>
