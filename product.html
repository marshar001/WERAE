<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BODEGS | Product</title>

  <link rel="stylesheet" href="styles.css">

  <!-- CENTRAL PRODUCT DATA -->
  <script src="products.js"></script>
</head>

<body>

  <main class="product-page">

    <!-- =================================
         PRODUCT GALLERY
         ================================= -->

    <section class="product-gallery">

      <!-- BACK BUTTON -->
      <a href="index.html" class="back-button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5L8 12L15 19"></path>
        </svg>
      </a>


      <!-- CART BUTTON -->
      <a
        href="cart.html"
        class="product-cart-button"
        aria-label="Cart"
      >

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 8h14l-1 12H6L5 8Z"></path>
          <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
        </svg>

        <span
          id="productCartCount"
          class="product-cart-count"
          hidden
        >
          0
        </span>

      </a>


      <!-- MAIN PRODUCT IMAGE -->
      <div class="main-product-image">

        <img
          id="mainProductImage"
          src=""
          alt=""
        >

        <div
          id="photoCounter"
          class="photo-counter"
        >
          1 / 1
        </div>

      </div>


      <!-- COLOR OPTIONS -->
      <div
        id="colorOptions"
        class="color-options"
      >
      </div>

    </section>



    <!-- =================================
         PRODUCT INFORMATION
         ================================= -->

    <section class="product-information">

      <p
        id="verifiedBadge"
        class="verified-badge"
      >
        ✓ VERIFIED BODEGS SELLER
      </p>


      <h1 id="productName">
        Product
      </h1>


      <p
        id="productPrice"
        class="product-price"
      >
        ₦0
      </p>


      <div class="product-meta">

        <span id="sellerVerification">
          ✓ Verified Seller
        </span>

        <span>
          ✓ Secure BODEGS Checkout
        </span>

      </div>


      <p
        id="productDescription"
        class="product-description"
      >
      </p>



      <!-- =================================
           SELLER
           ================================= -->

      <div class="seller-card">

        <div class="seller-top">

          <div>

            <strong id="sellerName">
              BODEGS Seller
            </strong>

            <p id="sellerStatus">
              ✓ BODEGS Verified Business
            </p>

          </div>

        </div>

        <p>
          Business seller verified by BODEGS.
        </p>

      </div>



      <!-- =================================
           BUYER PROTECTION
           ================================= -->

      <div class="protection-card">

        <h2>
          Buyer Protection
        </h2>

        <p>
          Your purchase is protected by BODEGS.
          Delivery and order protection apply.
        </p>

      </div>



      <!-- =================================
           ACTION BUTTONS
           ================================= -->

      <div class="product-actions">

        <button
          id="addToCartButton"
          class="cart-button"
          type="button"
        >
          Add to Cart
        </button>

        <button
          id="buyButton"
          class="buy-button"
          type="button"
        >
          Checkout
        </button>

      </div>

    </section>



    <!-- =================================
         RECOMMENDED PRODUCTS
         ================================= -->

    <section class="recommended">

      <h2>
        YOU MAY ALSO LIKE
      </h2>

      <div
        id="recommendedGrid"
        class="recommended-grid"
      >
      </div>

    </section>

  </main>



  <script>

    /* =================================
       GET PRODUCT FROM CENTRAL DATA
       ================================= */

    const params =
      new URLSearchParams(window.location.search);

    const productId =
      params.get("id");


    /*
      Backward compatibility:

      If somebody opens product.html
      without an ID, show Premium Handbag.

      This means the old product.html
      URL will not immediately break.
    */

    const selectedProductId =
      productId || "prod_premium_handbag";


    const product =
      window.BODEGS &&
      window.BODEGS.getProductById
        ? window.BODEGS.getProductById(
            selectedProductId
          )
        : null;


    /* =================================
       PRODUCT NOT FOUND
       ================================= */

    if (!product) {

      document.title =
        "Product Not Found | BODEGS";

      document.querySelector(
        ".product-page"
      ).innerHTML = `

        <section
          style="
            padding:40px 20px;
            text-align:center;
          "
        >

          <h1>
            Product not found
          </h1>

          <p>
            This product is no longer available.
          </p>

          <a
            href="index.html"
            class="back-button"
          >
            Back to BODEGS
          </a>

        </section>

      `;

      throw new Error(
        "BODEGS product not found: " +
        selectedProductId
      );

    }



    /* =================================
       PAGE TITLE
       ================================= */

    document.title =
      product.name + " | BODEGS";



    /* =================================
       BASIC PRODUCT INFORMATION
       ================================= */

    document.getElementById(
      "productName"
    ).textContent =
      product.name;


    document.getElementById(
      "productPrice"
    ).textContent =
      window.BODEGS.formatCurrency(
        product.price,
        product.currency
      );


    document.getElementById(
      "productDescription"
    ).textContent =
      product.description;


    document.getElementById(
      "sellerName"
    ).textContent =
      product.sellerName || "BODEGS Seller";



    /* =================================
       SELLER VERIFICATION
       ================================= */

    const verifiedBadge =
      document.getElementById(
        "verifiedBadge"
      );

    const sellerVerification =
      document.getElementById(
        "sellerVerification"
      );

    const sellerStatus =
      document.getElementById(
        "sellerStatus"
      );


    if (product.sellerVerified) {

      verifiedBadge.textContent =
        "✓ VERIFIED BODEGS SELLER";

      sellerVerification.textContent =
        "✓ Verified Seller";

      sellerStatus.textContent =
        "✓ BODEGS Verified Business";

    } else {

      verifiedBadge.textContent =
        "BODEGS SELLER";

      sellerVerification.textContent =
        "Seller";

      sellerStatus.textContent =
        "BODEGS Seller";

    }



    /* =================================
       PRODUCT IMAGE GALLERY
       ================================= */

    const productImages =
      Array.isArray(product.images) &&
      product.images.length
        ? product.images
        : [];


    let currentImage = 0;


    const mainProductImage =
      document.getElementById(
        "mainProductImage"
      );


    const photoCounter =
      document.getElementById(
        "photoCounter"
      );


    function showProductImage(index) {

      if (!productImages.length) {
        return;
      }


      currentImage =
        (
          index +
          productImages.length
        ) %
        productImages.length;


      mainProductImage.src =
        productImages[currentImage];


      mainProductImage.alt =
        product.name;


      photoCounter.textContent =
        (currentImage + 1) +
        " / " +
        productImages.length;

    }


    showProductImage(0);



    /* =================================
       COLOR OPTIONS
       ================================= */

    const colorOptions =
      document.getElementById(
        "colorOptions"
      );


    colorOptions.innerHTML = "";


    if (
      Array.isArray(product.colors) &&
      product.colors.length
    ) {

      product.colors.forEach(
        (color, index) => {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "color-option" +
            (
              index === 0
                ? " active"
                : ""
            );

          button.setAttribute(
            "aria-label",
            color.name
          );


          const swatch =
            document.createElement(
              "span"
            );

          swatch.className =
            "color-swatch";


          swatch.style.background =
            color.value ||
            "#111111";


          const label =
            document.createElement(
              "span"
            );

          label.textContent =
            color.name;


          button.appendChild(
            swatch
          );

          button.appendChild(
            label
          );


          colorOptions.appendChild(
            button
          );

        }
      );

    }



    /* =================================
       SWIPE GALLERY
       ================================= */

    let startX = 0;


    mainProductImage.addEventListener(
      "touchstart",
      function(event) {

        startX =
          event.touches[0].clientX;

      }
    );


    mainProductImage.addEventListener(
      "touchend",
      function(event) {

        const endX =
          event.changedTouches[0].clientX;


        const difference =
          startX - endX;


        if (
          Math.abs(difference) > 50
        ) {

          if (difference > 0) {

            showProductImage(
              currentImage + 1
            );

          } else {

            showProductImage(
              currentImage - 1
            );

          }

        }

      }
    );



    /* =================================
       CART
       ================================= */

    const addToCartButton =
      document.getElementById(
        "addToCartButton"
      );


    const buyButton =
      document.getElementById(
        "buyButton"
      );


    const productCartButton =
      document.querySelector(
        ".product-cart-button"
      );


    const productCartCount =
      document.getElementById(
        "productCartCount"
      );



    function getCart() {

      return JSON.parse(
        localStorage.getItem(
          "weraeCart"
        ) || "[]"
      );

    }



    function saveCart(cart) {

      localStorage.setItem(
        "weraeCart",
        JSON.stringify(cart)
      );

    }



    function updateProductCartCount() {

      const cart =
        getCart();


      /*
        Count total quantities rather
        than just number of products.
      */

      const totalQuantity =
        cart.reduce(
          (total, item) =>
            total +
            Number(
              item.quantity || 1
            ),
          0
        );


      productCartCount.textContent =
        totalQuantity;


      productCartCount.hidden =
        totalQuantity === 0;

    }



    /* =================================
       ADD PRODUCT TO CART
       ================================= */

    function addProductToCart() {

      const cart =
        getCart();


      /*
        New stable identity:

        productId

        We no longer use the page URL
        as the product's identity.
      */

      const existingItem =
        cart.find(
          item =>
            item.productId ===
            product.id
        );


      if (existingItem) {

        existingItem.quantity =
          Number(
            existingItem.quantity || 1
          ) + 1;

      } else {

        /*
          Keep the old fields as well
          because the existing cart page
          still uses them.

          productId is now the real
          marketplace identity.
        */

        cart.push({

          productId:
            product.id,

          sellerId:
            product.sellerId,

          name:
            product.name,

          price:
            window.BODEGS.formatCurrency(
              product.price,
              product.currency
            ),

          numericPrice:
            product.price,

          image:
            product.images &&
            product.images.length
              ? product.images[0]
              : "",

          url:
            "product.html?id=" +
            encodeURIComponent(
              product.id
            ),

          quantity: 1

        });

      }


      saveCart(cart);

      updateProductCartCount();

      animateProductToCart();

    }



    /* =================================
       ADD TO CART ANIMATION
       ================================= */

    function animateProductToCart() {

      const sourceImage =
        document.getElementById(
          "mainProductImage"
        );


      const sourceRect =
        sourceImage.getBoundingClientRect();


      const targetRect =
        productCartButton.getBoundingClientRect();


      const flyingImage =
        document.createElement(
          "img"
        );


      flyingImage.src =
        sourceImage.src;


      flyingImage.alt =
        "";


      flyingImage.setAttribute(
        "aria-hidden",
        "true"
      );


      flyingImage.style.position =
        "fixed";


      flyingImage.style.left =
        sourceRect.left + "px";


      flyingImage.style.top =
        sourceRect.top + "px";


      flyingImage.style.width =
        sourceRect.width + "px";


      flyingImage.style.height =
        sourceRect.height + "px";


      flyingImage.style.objectFit =
        "contain";


      flyingImage.style.borderRadius =
        "22px";


      flyingImage.style.zIndex =
        "2000";


      flyingImage.style.pointerEvents =
        "none";


      flyingImage.style.transition =
        "left 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), " +
        "top 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), " +
        "width 0.55s ease, " +
        "height 0.55s ease, " +
        "opacity 0.55s ease";


      document.body.appendChild(
        flyingImage
      );


      requestAnimationFrame(
        () => {

          flyingImage.style.left =
            (
              targetRect.left +
              targetRect.width / 2 -
              22
            ) + "px";


          flyingImage.style.top =
            (
              targetRect.top +
              targetRect.height / 2 -
              22
            ) + "px";


          flyingImage.style.width =
            "44px";


          flyingImage.style.height =
            "44px";


          flyingImage.style.borderRadius =
            "10px";


          flyingImage.style.opacity =
            "0.25";

        }
      );


      flyingImage.addEventListener(
        "transitionend",
        () =>
          flyingImage.remove(),
        {
          once: true
        }
      );


      productCartButton.classList.add(
        "cart-bounce"
      );


      setTimeout(
        () => {

          productCartButton.classList.remove(
            "cart-bounce"
          );

        },
        500
      );

    }



    /* =================================
       ADD TO CART BUTTON
       ================================= */

    addToCartButton.addEventListener(
      "click",
      function() {

        addProductToCart();

      }
    );



    /* =================================
       CHECKOUT BUTTON
       ================================= */

    buyButton.addEventListener(
      "click",
      function() {

        addProductToCart();

        setTimeout(
          () => {

            window.location.href =
              "cart.html";

          },
          350
        );

      }
    );



    /* =================================
       CART BUTTON
       ================================= */

    productCartButton.addEventListener(
      "click",
      function() {

        localStorage.setItem(
          "weraeLastProductPage",
          window.location.href
        );

      }
    );



    /* =================================
       RECENTLY VIEWED
       ================================= */

    function updateRecentlyViewed() {

      const recentlyViewed =
        JSON.parse(
          localStorage.getItem(
            "weraeRecentlyViewed"
          ) || "[]"
        );


      /*
        The product ID is now the
        identity of a recently viewed
        product.
      */

      const recentlyViewedProduct = {

        productId:
          product.id,

        sellerId:
          product.sellerId,

        name:
          product.name,

        price:
          window.BODEGS.formatCurrency(
            product.price,
            product.currency
          ),

        numericPrice:
          product.price,

        image:
          product.images &&
          product.images.length
            ? product.images[0]
            : "",

        url:
          "product.html?id=" +
          encodeURIComponent(
            product.id
          )

      };


      const filtered =
        recentlyViewed.filter(
          item =>
            item.productId !==
            product.id
        );


      filtered.unshift(
        recentlyViewedProduct
      );


      localStorage.setItem(
        "weraeRecentlyViewed",
        JSON.stringify(
          filtered.slice(0, 6)
        )
      );

    }


    updateRecentlyViewed();



    /* =================================
       RECOMMENDED PRODUCTS
       ================================= */

    const recommendedGrid =
      document.getElementById(
        "recommendedGrid"
      );


    const allProducts =
      window.BODEGS.getAllProducts();


    const recommendedProducts =
      allProducts
        .filter(
          item =>
            item.id !==
            product.id
        )
        .slice(0, 2);


    recommendedGrid.innerHTML = "";


    recommendedProducts.forEach(
      recommendedProduct => {

        const card =
          document.createElement(
            "a"
          );


        card.className =
          "recommended-card";


        card.href =
          "product.html?id=" +
          encodeURIComponent(
            recommendedProduct.id
          );


        const imageWrapper =
          document.createElement(
            "div"
          );


        const image =
          document.createElement(
            "img"
          );


        image.src =
          recommendedProduct.images &&
          recommendedProduct.images.length
            ? recommendedProduct.images[0]
            : "";


        image.alt =
          recommendedProduct.name;


        imageWrapper.appendChild(
          image
        );


        const title =
          document.createElement(
            "h3"
          );


        title.textContent =
          recommendedProduct.name;


        const price =
          document.createElement(
            "p"
          );


        price.textContent =
          window.BODEGS.formatCurrency(
            recommendedProduct.price,
            recommendedProduct.currency
          );


        card.appendChild(
          imageWrapper
        );


        card.appendChild(
          title
        );


        card.appendChild(
          price
        );


        recommendedGrid.appendChild(
          card
        );

      }
    );



    /* =================================
       INITIAL CART COUNT
       ================================= */

    updateProductCartCount();

  </script>

</body>
  </html>
